<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Sprout Explorer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:#f0fff4;min-height:100vh;}
#home{display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px;}
.home-emoji{font-size:80px;margin-top:24px;}
.home-title{font-size:32px;font-weight:900;color:#2d6a4f;margin:8px 0 4px;}
.home-sub{font-size:16px;color:#52796f;margin-bottom:28px;}
.quest-card{width:100%;max-width:400px;display:flex;align-items:center;gap:14px;border-radius:20px;border-width:3px;border-style:solid;padding:16px;margin-bottom:16px;cursor:pointer;transition:transform .1s;}
.quest-card:active{transform:scale(.97);}
.quest-card-emoji{font-size:42px;}
.quest-card-title{font-size:20px;font-weight:800;}
.quest-card-goal{font-size:14px;color:#444;margin-top:2px;}
.quest-card-hint{font-size:12px;color:#888;margin-top:4px;}
#cam-screen{display:none;flex-direction:column;height:100vh;position:relative;background:#000;}
#video{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;}
#canvas{display:none;}
.hud{position:absolute;top:40px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 16px;z-index:10;}
.back-btn{background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer;}
.hud-badge{display:flex;align-items:center;gap:6px;border-radius:20px;padding:8px 16px;}
.hud-badge span{color:#fff;font-weight:900;font-size:18px;}
.goal-card{position:absolute;bottom:160px;left:20px;right:20px;background:rgba(255,255,255,.9);border-radius:20px;padding:14px;text-align:center;z-index:10;}
.goal-text{font-size:16px;font-weight:700;color:#333;}
.stars-row{display:flex;gap:6px;justify-content:center;margin-top:8px;}
.star{font-size:24px;opacity:.25;transition:opacity .3s,transform .3s;}
.star.lit{opacity:1;transform:scale(1.2);}
.snap-row{position:absolute;bottom:50px;left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:10;}
.snap-btn{width:80px;height:80px;border-radius:50%;border-width:5px;border-style:solid;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;transition:transform .1s;}
.snap-btn:active{transform:scale(.93);}
.snap-hint{margin-top:8px;color:rgba(255,255,255,.85);font-weight:700;font-size:14px;}
#load-ov{display:none;position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:20;flex-direction:column;align-items:center;justify-content:center;}
#load-ov.show{display:flex;}
.spinner{width:60px;height:60px;border:6px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{color:#fff;font-size:18px;font-weight:700;}
#burst{display:none;position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:25;flex-direction:column;align-items:center;justify-content:center;}
#burst.show{display:flex;}
.burst-card{background:#fff;border-radius:28px;padding:32px;text-align:center;animation:bIn .5s ease;}
@keyframes bIn{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.burst-emoji{font-size:56px;}
.burst-title{font-size:28px;font-weight:900;color:#2d6a4f;margin-top:8px;}
.burst-lbl{font-size:16px;color:#666;margin-top:4px;}
#cel{display:none;flex-direction:column;align-items:center;padding:32px 20px 60px;min-height:100vh;}
#cel.show{display:flex;}
.cel-emoji{font-size:80px;margin-top:24px;}
.cel-title{font-size:34px;font-weight:900;margin-top:8px;}
.cel-sub{font-size:18px;color:#52796f;margin-top:4px;margin-bottom:16px;}
.trophy-card{width:100%;max-width:400px;border-radius:20px;border-width:3px;border-style:solid;background:#fff;padding:20px;text-align:center;margin-top:16px;}
.trophy-name{font-size:22px;font-weight:800;color:#333;}
.trophy-badge{font-size:15px;color:#666;margin-top:6px;}
.photo-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.photo-item{display:flex;flex-direction:column;align-items:center;width:calc(33% - 7px);}
.photo-thumb{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;}
.photo-lbl{font-size:11px;color:#666;margin-top:4px;text-align:center;}
.play-btn{margin-top:28px;border:none;border-radius:50px;padding:18px 40px;font-size:20px;font-weight:900;color:#fff;cursor:pointer;}
</style>
</head>
<body>
<div id="home">
  <div class="home-emoji">🌱</div>
  <div class="home-title">Sprout Explorer!</div>
  <div class="home-sub">Pick a quest and start snapping!</div>
  <div id="qlist"></div>
</div>
<div id="cam-screen">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="hud">
    <button class="back-btn" onclick="goHome()">← Home</button>
    <div class="hud-badge" id="hud-badge"><span id="hud-emoji">🌸</span><span id="hud-prog">0/3</span></div>
  </div>
  <div class="goal-card">
    <div class="goal-text" id="goal-text"></div>
    <div class="stars-row" id="stars-row"></div>
  </div>
  <div class="snap-row">
    <div class="snap-btn" id="snap-btn" onclick="snap()">📸</div>
    <div class="snap-hint">Tap to snap!</div>
  </div>
  <div id="load-ov"><div class="spinner"></div><div class="load-txt">Checking... 🔍</div></div>
  <div id="burst"><div class="burst-card"><div class="burst-emoji">🎉</div><div class="burst-title">Found it!</div><div class="burst-lbl" id="burst-lbl"></div></div></div>
</div>
<div id="cel">
  <div class="cel-emoji">🏆</div>
  <div class="cel-title" id="cel-title"></div>
  <div class="cel-sub" id="cel-sub"></div>
  <div class="stars-row" id="cel-stars"></div>
  <div class="trophy-card" id="trophy-card">
    <div class="trophy-name" id="trophy-name"></div>
    <div class="trophy-badge" id="trophy-badge"></div>
  </div>
  <div style="width:100%;max-width:400px;margin-top:20px;">
    <div style="font-size:16px;font-weight:700;color:#444;">Your finds:</div>
    <div class="photo-row" id="photo-row"></div>
  </div>
  <button class="play-btn" id="play-btn" onclick="goHome()">Try Another Quest! 🌱</button>
</div>
<script>
const Q=[
  {id:'flowers',emoji:'🌸',title:'Flower Hunter',goal:'Find 3 flowers around you!',target:3,color:'#FF6B9D',light:'#FFE4F0',hint:'Look outside or on the balcony!',prompt:'Does this photo contain any plant, flower, leaf, tree, grass, or any green vegetation? Be generous - even a small plant counts. Answer YES or NO, then in 5 words describe what you see.'},
  {id:'devices',emoji:'💡',title:'Device Detective',goal:'Find 3 electrical devices at home!',target:3,color:'#6C63FF',light:'#EAE8FF',hint:'TV, lamp, phone are everywhere!',prompt:'Does this photo contain any electrical device, screen, appliance, wire, charger, keyboard, mouse, laptop, phone, TV, fan, or anything electronic? Be generous. Answer YES or NO, then in 5 words describe what you see.'},
  {id:'round',emoji:'⭕',title:'Shape Spotter',goal:'Find 3 round objects!',target:3,color:'#F59E0B',light:'#FEF3C7',hint:'Balls, clocks, plates are round!',prompt:'Does this photo contain any round, circular, oval or curved object like a plate, bowl, clock, ball, wheel, cup, coin or similar? Be generous. Answer YES or NO, then in 5 words describe what you see.'}
];
let cq=null,found=0,caps=[],stream=null;
const ql=document.getElementById('qlist');
Q.forEach(q=>{
  const d=document.createElement('div');d.className='quest-card';
  d.style.cssText=`background:${q.light};border-color:${q.color};`;
  d.innerHTML=`<div class="quest-card-emoji">${q.emoji}</div><div><div class="quest-card-title" style="color:${q.color}">${q.title}</div><div class="quest-card-goal">${q.goal}</div><div class="quest-card-hint">💡 ${q.hint}</div></div>`;
  d.onclick=()=>startQ(q);ql.appendChild(d);
});
async function startQ(q){
  cq=q;found=0;caps=[];
  document.getElementById('home').style.display='none';
  const cs=document.getElementById('cam-screen');cs.style.display='flex';
  document.getElementById('hud-badge').style.background=q.color;
  document.getElementById('hud-emoji').textContent=q.emoji;
  document.getElementById('hud-prog').textContent=`0/${q.target}`;
  document.getElementById('goal-text').textContent=q.goal;
  document.getElementById('snap-btn').style.borderColor=q.color;
  buildStars('stars-row',0,q.target);
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    document.getElementById('video').srcObject=stream;
  }catch(e){alert('Please allow camera access to play!');}
}
function buildStars(id,count,total){
  const el=document.getElementById(id);el.innerHTML='';
  for(let i=0;i<total;i++){const s=document.createElement('span');s.className='star'+(i<count?' lit':'');s.textContent='⭐';el.appendChild(s);}
}
async function snap(){
  if(!cq)return;
  const btn=document.getElementById('snap-btn');btn.style.pointerEvents='none';
  document.getElementById('load-ov').classList.add('show');
  try{
    let b64;
    // Try ImageCapture API first (best on Android)
    try{
      const track=stream.getVideoTracks()[0];
      const ic=new ImageCapture(track);
      const blob=await ic.takePhoto();
      b64=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.readAsDataURL(blob);});
    }catch(e){
      // Fallback to canvas
      const v=document.getElementById('video'),c=document.getElementById('canvas');
      await new Promise(r=>setTimeout(r,500));
      c.width=v.videoWidth||640;c.height=v.videoHeight||480;
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);
      b64=c.toDataURL('image/jpeg',0.9).split(',')[1];
    }
    const r=await askClaude(b64,cq.prompt);
    document.getElementById('load-ov').classList.remove('show');
    if(r.found){
      found++;caps.push({dataUrl:c.toDataURL('image/jpeg',.6),label:r.label});
      document.getElementById('burst-lbl').textContent=r.label;
      document.getElementById('burst').classList.add('show');
      document.getElementById('hud-prog').textContent=`${found}/${cq.target}`;
      buildStars('stars-row',found,cq.target);
      setTimeout(()=>{document.getElementById('burst').classList.remove('show');if(found>=cq.target)setTimeout(showCel,300);},1800);
    }else{alert(`Not quite! I see: ${r.label}\nKeep looking for ${cq.emoji}!`);}
  }catch(e){document.getElementById('load-ov').classList.remove('show');alert('Something went wrong. Try again!');}
  btn.style.pointerEvents='auto';
}
async function askClaude(b64,prompt){
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':'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','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:100,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:prompt}]}]})});
  const data=await res.json();
  const text=data?.content?.[0]?.text??'';
  return{found:text.toUpperCase().startsWith('YES'),label:text.replace(/^(YES|NO)[,.\s]*/i,'').trim()||'Something!'};
}
function showCel(){
  if(stream){stream.getTracks().forEach(t=>t.stop());}
  document.getElementById('cam-screen').style.display='none';
  const cel=document.getElementById('cel');cel.style.background=cq.light;cel.classList.add('show');
  document.getElementById('cel-title').style.color=cq.color;document.getElementById('cel-title').textContent='Quest Complete!';
  document.getElementById('cel-sub').textContent=`You found ${cq.target} ${cq.emoji}!`;
  buildStars('cel-stars',cq.target,cq.target);
  document.getElementById('trophy-card').style.borderColor=cq.color;
  document.getElementById('trophy-name').textContent=cq.title;
  document.getElementById('trophy-badge').textContent=`${cq.emoji} Explorer Badge Earned!`;
  document.getElementById('play-btn').style.background=cq.color;
  const pr=document.getElementById('photo-row');pr.innerHTML='';
  caps.forEach(c=>{const d=document.createElement('div');d.className='photo-item';d.innerHTML=`<img class="photo-thumb" src="${c.dataUrl}"/><div class="photo-lbl">${c.label}</div>`;pr.appendChild(d);});
}
function goHome(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  document.getElementById('cam-screen').style.display='none';
  document.getElementById('cel').classList.remove('show');
  document.getElementById('home').style.display='flex';
  cq=null;found=0;caps=[];
}
</script>
</body>
</html>
