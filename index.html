<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sprout – Bud's Bubble Pop!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(180deg, #a8edea 0%, #fed6e3 100%);
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  #garden-bg {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(180deg, transparent, #6dbf6740);
  }

  #app {
    display: flex; flex-direction: column; align-items: center;
    height: 100vh; padding: 20px 16px 10px;
    position: relative;
  }

  /* ── BUD ── */
  #bud-container {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 8px; animation: budFloat 3s ease-in-out infinite;
  }
  @keyframes budFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  #bud-face {
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #fff9c4, #a5d86e);
    border: 4px solid #5aac3e;
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; position: relative;
    box-shadow: 0 6px 24px #0002;
  }
  #bud-face::before {
    content: '🌿';
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-size: 28px;
  }
  #speech-bubble {
    background: #fff; border-radius: 20px;
    padding: 10px 18px; margin-top: 10px;
    font-size: 17px; font-weight: 700; color: #444;
    box-shadow: 0 4px 12px #0001;
    max-width: 280px; text-align: center;
    transition: opacity .3s;
    position: relative;
  }
  #speech-bubble::before {
    content: '';
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    border: 10px solid transparent;
    border-bottom-color: #fff; border-top: 0;
  }

  /* ── TARGET LETTER ── */
  #target-box {
    background: linear-gradient(135deg, #fff9c4, #ffe082);
    border: 4px solid #f9a825; border-radius: 24px;
    padding: 10px 36px; margin: 8px 0;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 4px 16px #f9a82544;
  }
  #target-label { font-size: 13px; color: #888; font-weight: 700; letter-spacing: 1px; }
  #target-letter {
    font-size: 72px; font-weight: 900; line-height: 1;
    color: #e65100;
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 #f9a82566;
    animation: letterPulse 2s ease-in-out infinite;
  }
  @keyframes letterPulse {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }

  /* ── SCORE ── */
  #score-bar {
    display: flex; gap: 6px; margin: 4px 0;
  }
  .star { font-size: 28px; filter: grayscale(1); transition: filter .3s, transform .3s; }
  .star.lit { filter: grayscale(0); transform: scale(1.2); }

  /* ── BUBBLES AREA ── */
  #bubble-area {
    flex: 1; position: relative; width: 100%; max-width: 420px;
  }

  .bubble {
    position: absolute;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 900; color: #fff;
    cursor: pointer;
    transition: transform .1s;
    box-shadow: inset -6px -6px 12px rgba(0,0,0,.12), 0 4px 20px rgba(0,0,0,.1);
    animation: bubbleDrift linear infinite;
    text-shadow: 1px 1px 3px rgba(0,0,0,.25);
    -webkit-tap-highlight-color: transparent;
  }
  .bubble:active { transform: scale(.92); }
  @keyframes bubbleDrift {
    0%   { transform: translateY(0px) translateX(0px); }
    25%  { transform: translateY(-12px) translateX(6px); }
    50%  { transform: translateY(-6px) translateX(-6px); }
    75%  { transform: translateY(-14px) translateX(4px); }
    100% { transform: translateY(0px) translateX(0px); }
  }

  /* ── BURST PARTICLES ── */
  .particle {
    position: fixed; pointer-events: none;
    width: 12px; height: 12px; border-radius: 50%;
    animation: particleFly .7s ease-out forwards;
  }
  @keyframes particleFly {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }

  /* ── CELEBRATION ── */
  #celebration {
    display: none; position: fixed; inset: 0;
    background: #fff9; backdrop-filter: blur(4px);
    flex-direction: column; align-items: center; justify-content: center;
    z-index: 100;
  }
  #celebration.show { display: flex; }
  #celebration-emoji { font-size: 80px; animation: bounceIn .5s ease; }
  #celebration-text {
    font-size: 32px; font-weight: 900; color: #5aac3e;
    margin: 12px 0; text-align: center;
  }
  #celebration-sub { font-size: 18px; color: #666; margin-bottom: 24px; }
  #next-btn {
    background: linear-gradient(135deg, #5aac3e, #a5d86e);
    color: #fff; border: none; border-radius: 50px;
    padding: 16px 48px; font-size: 22px; font-weight: 900;
    cursor: pointer; box-shadow: 0 6px 20px #5aac3e44;
    transition: transform .1s;
  }
  #next-btn:active { transform: scale(.96); }
  @keyframes bounceIn {
    0%   { transform: scale(0); }
    60%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* confetti */
  .confetti {
    position: fixed; pointer-events: none;
    width: 10px; height: 14px;
    animation: confettiFall linear forwards;
    z-index: 99;
  }
  @keyframes confettiFall {
    0%   { opacity: 1; transform: translateY(-10px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>
<div id="garden-bg"></div>
<div id="app">

  <!-- BUD -->
  <div id="bud-container">
    <div id="bud-face">🌱</div>
    <div id="speech-bubble" id="speech">Loading…</div>
  </div>

  <!-- TARGET -->
  <div id="target-box">
    <div id="target-label">FIND THE LETTER</div>
    <div id="target-letter">A</div>
  </div>

  <!-- STARS -->
  <div id="score-bar">
    <span class="star">⭐</span>
    <span class="star">⭐</span>
    <span class="star">⭐</span>
    <span class="star">⭐</span>
    <span class="star">⭐</span>
  </div>

  <!-- BUBBLES -->
  <div id="bubble-area"></div>

</div>

<!-- CELEBRATION -->
<div id="celebration">
  <div id="celebration-emoji">🎉</div>
  <div id="celebration-text">Amazing!</div>
  <div id="celebration-sub">You found all 5 letters!</div>
  <button id="next-btn" onclick="restartGame()">Play Again! 🌱</button>
</div>

<script>
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const COLORS = [
  ['#FF6B6B','#ee5a24'],['#FFC312','#f9ca24'],['#06D6A0','#00b894'],
  ['#4ECDC4','#00cec9'],['#A29BFE','#6c5ce7'],['#FF7675','#d63031'],
  ['#FDCB6E','#e17055'],['#74B9FF','#0984e3'],['#55EFC4','#00b894'],
  ['#FDA7DF','#e84393']
];
const PHRASES = [
  'Can you find the letter', 'Pop the bubble with',
  'Find the letter', 'Touch the letter'
];

let target = '';
let score = 0;
let round = 0;
const TOTAL_ROUNDS = 5;

function pickTarget() {
  return LETTERS[Math.floor(Math.random() * 26)];
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - .5);
}

function getDistractors(t, n) {
  const pool = LETTERS.filter(l => l !== t);
  const shuffled = shuffle(pool);
  return shuffled.slice(0, n);
}

function setBubbles(target) {
  const area = document.getElementById('bubble-area');
  area.innerHTML = '';
  const rect = area.getBoundingClientRect();
  const W = rect.width || 340;
  const H = rect.height || 300;

  const distractors = getDistractors(target, 4);
  const letters = shuffle([target, ...distractors]);
  const size = Math.min(72, Math.floor(W / 5.5));

  // Place bubbles without overlap
  const placed = [];
  letters.forEach((letter, i) => {
    let x, y, tries = 0;
    do {
      x = size/2 + Math.random() * (W - size);
      y = size/2 + Math.random() * (H - size - 20);
      tries++;
    } while(tries < 50 && placed.some(p => Math.hypot(p.x-x,p.y-y) < size+8));
    placed.push({x, y});

    const color = COLORS[i % COLORS.length];
    const div = document.createElement('div');
    div.className = 'bubble';
    div.textContent = letter;
    div.dataset.letter = letter;
    div.style.cssText = `
      width:${size}px; height:${size}px;
      left:${x - size/2}px; top:${y - size/2}px;
      background: radial-gradient(circle at 38% 32%, #fff6, transparent 60%),
                  linear-gradient(135deg, ${color[0]}, ${color[1]});
      animation-duration: ${2.5 + Math.random()*2}s;
      animation-delay: ${-Math.random()*3}s;
    `;
    div.addEventListener('click', () => onBubbleTap(div, letter, target));
    area.appendChild(div);
  });
}

function onBubbleTap(el, letter, target) {
  if (!el.parentNode) return;
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  if (letter === target) {
    burstParticles(cx, cy, el.style.background);
    playTone(true);
    el.remove();
    score++;
    lightStar(score - 1);
    round++;
    if (round >= TOTAL_ROUNDS) {
      setTimeout(showCelebration, 400);
    } else {
      setTimeout(nextRound, 600);
    }
  } else {
    // Wrong — wiggle
    playTone(false);
    el.style.animation = 'none';
    el.style.transform = 'scale(1.15) rotate(-8deg)';
    setTimeout(() => {
      el.style.transform = 'scale(1.15) rotate(8deg)';
      setTimeout(() => {
        el.style.transform = '';
        el.style.animation = '';
      }, 150);
    }, 150);
    setBudSpeech(`Hmm… that's ${letter}. Find the ${target}! 🤔`);
  }
}

function burstParticles(cx, cy, bg) {
  const colors = ['#FFD700','#FF6B6B','#4ECDC4','#A29BFE','#06D6A0','#FFC312'];
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (i / 16) * Math.PI * 2;
    const dist = 60 + Math.random() * 60;
    p.style.cssText = `
      left:${cx}px; top:${cy}px;
      background:${colors[i%colors.length]};
      --dx:${Math.cos(angle)*dist}px;
      --dy:${Math.sin(angle)*dist}px;
    `;
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

function playTone(correct) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (correct) {
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + .1);
      osc.frequency.setValueAtTime(784, ctx.currentTime + .2);
      gain.gain.setValueAtTime(.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .5);
      osc.start(); osc.stop(ctx.currentTime + .5);
    } else {
      osc.frequency.setValueAtTime(300, ctx.currentTime);
      osc.frequency.setValueAtTime(250, ctx.currentTime + .15);
      gain.gain.setValueAtTime(.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .3);
      osc.start(); osc.stop(ctx.currentTime + .3);
    }
  } catch(e) {}
}

function lightStar(i) {
  const stars = document.querySelectorAll('.star');
  if (stars[i]) stars[i].classList.add('lit');
}

function setBudSpeech(text) {
  document.getElementById('speech-bubble').textContent = text;
}

function nextRound() {
  target = pickTarget();
  document.getElementById('target-letter').textContent = target;
  const phrase = PHRASES[Math.floor(Math.random() * PHRASES.length)];
  setBudSpeech(`${phrase} ${target}! 🫧`);
  setBubbles(target);
}

function showCelebration() {
  spawnConfetti();
  document.getElementById('celebration').classList.add('show');
}

function spawnConfetti() {
  const colors = ['#FF6B6B','#FFC312','#06D6A0','#4ECDC4','#A29BFE','#FF7675'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.cssText = `
      left:${Math.random()*100}vw;
      top: -20px;
      background:${colors[i%colors.length]};
      animation-duration:${1.2 + Math.random()*1.5}s;
      animation-delay:${Math.random()*.8}s;
      border-radius:${Math.random() > .5 ? '50%' : '2px'};
    `;
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}

function restartGame() {
  score = 0; round = 0;
  document.querySelectorAll('.star').forEach(s => s.classList.remove('lit'));
  document.getElementById('celebration').classList.remove('show');
  nextRound();
}

// Start!
nextRound();
</script>
</body>
</html>
